[project]
name = "subit-core"
version = "5.1.0"
description = "SUBIT-∞ v5.1 — ядро: S₀=64 як TINYINT, (S₀,⊕)≅ℤ₂⁶, F:4096→4096, Ω≤4096 кроків"
readme = "README.md"
license = { text = "MIT" }
authors = [
  { name = "Slavick Ciganec", email = "slavick.ciganec@gmail.com" }
]
keywords = ["subit", "coinduction", "hypergraph", "semantics", "coalgebra", "Q6"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Scientific/Engineering :: Mathematics",
]
requires-python = ">=3.9"
dependencies = []

[project.urls]
Homepage = "https://github.com/sciganec/subit-core"
Repository = "https://github.com/sciganec/subit-core"
Documentation = "https://github.com/sciganec/subit-core/tree/main/docs/spec/v5.1"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["."]

# Для pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py39"

[project.optional-dependencies]
dev = ["pytest", "ruff"]
